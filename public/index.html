<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Every trip, every document, everyone — in one place." />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <title>Trip Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --text-display: 700 48px/56px var(--font-display);
        --text-h1: 700 24px/32px var(--font-display);
        --text-h1-light: 400 24px/32px var(--font-display);
        --text-h2: 700 20px/28px var(--font-display);
        --text-h3: 700 16px/24px var(--font-body);
        --text-large: 500 16px/24px var(--font-body);
        --text-section: 500 20px/28px var(--font-body);
        --text-base: 400 14px/20px var(--font-body);
        --text-link: 500 14px/20px var(--font-body);
        --text-bold: 700 14px/20px var(--font-body);
        --text-caption: 400 12px/16px var(--font-body);
        --text-caption-medium: 500 12px/16px var(--font-body);
      }
      * { box-sizing: border-box; }
      body { background-color: #C4A882; margin: 0; color: #6E1A10; font-family: var(--font-body); font-size: 14px; font-weight: 400; line-height: 20px; text-transform: none; }
      h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); }
      button, input, textarea, select { font-family: var(--font-body); }
      .text-display { font: var(--text-display); }
      .text-heading-1 { font: var(--text-h1); }
      .text-heading-1-light { font: var(--text-h1-light); }
      .text-heading-2 { font: var(--text-h2); }
      .text-heading-3 { font: var(--text-h3); }
      .text-large { font: var(--text-large); }
      .text-section { font: var(--text-section); }
      .text-body { font: var(--text-base); }
      .text-link { font: var(--text-link); }
      .text-bold { font: var(--text-bold); }
      .text-caption { font: var(--text-caption); }
      .text-caption-medium { font: var(--text-caption-medium); }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
